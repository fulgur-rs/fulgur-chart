[package]
name = "fulgur-chart-cli"
version = "0.1.21"
description = "CLI for rendering chart.js-compatible JSON specs to deterministic SVG/PNG"
keywords = ["chart", "svg", "chartjs", "cli", "visualization"]
categories = ["command-line-utilities", "graphics"]
readme = "../../README.md"
documentation = "https://github.com/fulgur-rs/fulgur-chart"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fulgur-chart"
path = "src/main.rs"

[dependencies]
fulgur-chart = { path = "../fulgur-chart", version = "0.13.2" }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jrsonnet-evaluator = "0.5.0-pre98"
jrsonnet-gcmodule = "0.4.6"
jrsonnet-ir = "0.5.0-pre98"
jrsonnet-stdlib = "0.5.0-pre98"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
